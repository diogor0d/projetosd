# configuração da aplicação Spring Boot Googol

# servidor web
server.port=8080
server.servlet.context-path=/

# aplicação
spring.application.name=Googol Web

# thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# recursos estáticos
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# configuração RMI
googol.rmi.host=localhost
googol.rmi.port=7000
googol.rmi.name=Gateway

# OpenRouter.ai API (modelos LLM)
# obter chave em: https://openrouter.ai/keys
# openrouter.api.key=sk-or-v1-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
# modelos disponíveis em: https://openrouter.ai/models
# modelos grátis: meta-llama/llama-3.1-8b-instruct:free, google/gemini-flash-1.5
# modelos pagos: anthropic/claude-3.5-sonnet, openai/gpt-4o, etc.
openrouter.model=meta-llama/llama-3.3-70b-instruct:free
openrouter.site.url=http://localhost:8080
openrouter.site.name=Googol Search Engine

# logging
logging.level.root=INFO
logging.level.frontend=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# websocket
spring.websocket.sockjs.enabled=true

# encoding
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
