<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}"
>
  <head>
    <title th:text="${query} + ' - Googol Search'"></title>
  </head>
  <body>
    <main>
      <!-- Search Bar below header -->
      <div class="page-search-bar">
        <form
          id="page-search-form"
          th:action="@{/search}"
          method="get"
          class="page-search-form"
        >
          <div class="page-search-input-wrapper">
            <input
              type="text"
              id="page-query-input"
              name="q"
              placeholder="Search..."
              autocomplete="off"
              class="page-search-input"
            />
            <button type="submit" class="page-search-btn">➝</button>
          </div>
          <div class="page-mode-switch">
            <label class="mode-option">
              <input type="radio" name="page-mode" value="search" checked />
              <span class="mode-label">Search</span>
            </label>
            <label class="mode-option">
              <input type="radio" name="page-mode" value="index" />
              <span class="mode-label">Index URL</span>
            </label>
            <label class="mode-option">
              <input type="radio" name="page-mode" value="hackernews" />
              <span class="mode-label">Index HN</span>
            </label>
          </div>
          <!-- Hidden field for returning to current search after indexing -->
          <input
            type="hidden"
            id="page-return-query"
            name="returnQuery"
            th:value="${query}"
          />
        </form>
      </div>

      <!-- Spell Check Suggestion (loaded asynchronously) -->
      <div
        id="spell-suggestion-container"
        class="spell-suggestion"
        style="
          margin: -0.5rem 0 1.5rem 0;
          padding: 0.75rem 0;
          text-align: left;
          font-size: 0.95rem;
          color: var(--text-secondary);
          display: none;
        "
      >
        <span>Did you mean: </span>
        <a
          id="spell-suggestion-link"
          href="#"
          class="spell-suggestion-link"
          style="
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
          "
        ></a>
        <span>?</span>
      </div>

      <!-- Success/Error Messages -->
      <div
        th:if="${success}"
        class="alert alert-success"
        style="
          margin-bottom: 1.5rem;
          padding: 1rem;
          background: rgba(129, 201, 149, 0.1);
          border: 1px solid var(--success);
          border-radius: 8px;
          color: var(--success);
        "
      >
        <span th:text="${success}"></span>
      </div>
      <div
        th:if="${error}"
        class="alert alert-error"
        style="
          margin-bottom: 1.5rem;
          padding: 1rem;
          background: rgba(242, 139, 130, 0.1);
          border: 1px solid var(--error);
          border-radius: 8px;
          color: var(--error);
        "
      >
        <span th:text="${error}"></span>
      </div>
      <div
        th:if="${hnMessage}"
        class="alert alert-success"
        style="
          margin-bottom: 1.5rem;
          padding: 1rem;
          background: rgba(129, 201, 149, 0.1);
          border: 1px solid var(--success);
          border-radius: 8px;
          color: var(--success);
        "
      >
        <span>📰 </span><span th:text="${hnMessage}"></span>
      </div>

      <div
        class="search-options"
        th:if="${query != null}"
        style="
          display: flex;
          align-items: center;
          gap: 1rem;
          margin-bottom: 1.5rem;
        "
      >
        <h2 style="font-weight: 400; color: var(--text-secondary); margin: 0">
          Results for
          <strong style="color: var(--accent)" th:text="${query}"></strong>
        </h2>

        <button
          type="button"
          class="btn-secondary"
          id="ai-analysis-btn"
          onclick="requestAIAnalysis()"
        >
          <span class="btn-icon">🤖</span>
          <span class="btn-text">AI Analysis</span>
        </button>
      </div>

      <!-- Results Count -->
      <div
        th:if="${totalCount != null && totalCount > 0}"
        style="
          margin-bottom: 1rem;
          color: var(--text-secondary);
          font-size: 0.9rem;
        "
      >
        About <strong th:text="${totalCount}">0</strong> results
        <span th:if="${searchTime != null}"
          >(<span th:text="${searchTime}">0.00</span> seconds)</span
        >
      </div>

      <!-- AI Analysis Loading/Result Container -->
      <div id="ai-analysis-container" style="display: none">
        <!-- Loading State -->
        <div id="ai-loading-pill" class="ai-loading-pill">
          <div class="ai-loading-content">
            <span class="ai-loading-icon">🤖</span>
            <span class="ai-loading-text">Generating AI analysis</span>
            <span class="ai-loading-dots">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </span>
          </div>
        </div>

        <!-- Result State -->
        <div id="ai-result-pill" class="ai-analysis-pill" style="display: none">
          <div class="ai-pill-header">
            <span class="ai-icon">🤖</span>
            <span class="ai-title">AI Contextual Analysis</span>
          </div>
          <div class="ai-pill-content" id="ai-analysis-content"></div>
          <button
            id="ai-show-more-btn"
            class="ai-show-more-btn"
            style="display: none"
            onclick="toggleAIContent()"
          >
            Show More
          </button>
        </div>
      </div>

      <div th:if="${hasResults}" class="search-results">
        <div th:each="result : ${results}" class="result-item">
          <div class="result-title">
            <a th:href="${result.url}" target="_blank" th:text="${result.title}"
              >Title</a
            >
          </div>
          <div class="result-url" th:text="${result.url}">url</div>
          <div class="result-citation" th:text="${result.snippet}">
            Description
          </div>

          <div style="margin-top: 0.5rem">
            <a
              th:href="@{/links-to(url=${result.url})}"
              style="
                color: var(--text-secondary);
                font-size: 0.8rem;
                text-decoration: none;
              "
            >
              ↳ See incoming links
            </a>
          </div>
        </div>
      </div>

      <div
        th:if="${!(hasResults ?: false) && query != null}"
        class="card"
        style="text-align: center; margin-top: 2rem"
      >
        <h3>No results found</h3>
        <p style="color: var(--text-secondary)">
          Try different keywords or index a new URL.
        </p>
      </div>

      <!-- Google-style Pagination -->
      <div
        th:if="${hasResults && totalPages > 1}"
        class="pagination"
        style="
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 0.5rem;
          margin-top: 3rem;
          flex-wrap: wrap;
        "
      >
        <!-- Previous Button -->
        <a
          th:if="${page > 0}"
          th:href="@{/search(q=${query}, page=${page - 1})}"
          class="pagination-nav"
          style="
            padding: 0.5rem 1rem;
            color: var(--accent);
            text-decoration: none;
            border-radius: 4px;
            transition: background 0.2s;
          "
          >← Previous</a
        >
        <span
          th:unless="${page > 0}"
          style="
            padding: 0.5rem 1rem;
            color: var(--text-disabled);
            cursor: not-allowed;
          "
          >← Previous</span
        >

        <!-- Page Numbers -->
        <th:block
          th:with="startPage=${page < 5 ? 0 : page - 4}, endPage=${page + 5 > totalPages ? totalPages - 1 : page + 4}"
        >
          <!-- First page + ellipsis if needed -->
          <a
            th:if="${startPage > 0}"
            th:href="@{/search(q=${query}, page=0)}"
            class="pagination-number"
            style="
              min-width: 2.5rem;
              padding: 0.5rem;
              text-align: center;
              color: var(--text-primary);
              text-decoration: none;
              border-radius: 4px;
              transition: background 0.2s;
            "
            >1</a
          >
          <span
            th:if="${startPage > 1}"
            style="color: var(--text-secondary); padding: 0.5rem"
            >...</span
          >

          <!-- Page number range -->
          <th:block th:each="i : ${#numbers.sequence(startPage, endPage)}">
            <a
              th:if="${i != page}"
              th:href="@{/search(q=${query}, page=${i})}"
              th:text="${i + 1}"
              class="pagination-number"
              style="
                min-width: 2.5rem;
                padding: 0.5rem;
                text-align: center;
                color: var(--text-primary);
                text-decoration: none;
                border-radius: 4px;
                transition: background 0.2s;
              "
            ></a>
            <span
              th:if="${i == page}"
              th:text="${i + 1}"
              class="pagination-current"
              style="
                min-width: 2.5rem;
                padding: 0.5rem;
                text-align: center;
                background: var(--accent);
                color: var(--bg-app);
                border-radius: 4px;
                font-weight: 600;
              "
            ></span>
          </th:block>

          <!-- Ellipsis + last page if needed -->
          <span
            th:if="${endPage < totalPages - 2}"
            style="color: var(--text-secondary); padding: 0.5rem"
            >...</span
          >
          <a
            th:if="${endPage < totalPages - 1}"
            th:href="@{/search(q=${query}, page=${totalPages - 1})}"
            th:text="${totalPages}"
            class="pagination-number"
            style="
              min-width: 2.5rem;
              padding: 0.5rem;
              text-align: center;
              color: var(--text-primary);
              text-decoration: none;
              border-radius: 4px;
              transition: background 0.2s;
            "
          ></a>
        </th:block>

        <!-- Next Button -->
        <a
          th:if="${hasMoreResults}"
          th:href="@{/search(q=${query}, page=${page + 1})}"
          class="pagination-nav"
          style="
            padding: 0.5rem 1rem;
            color: var(--accent);
            text-decoration: none;
            border-radius: 4px;
            transition: background 0.2s;
          "
          >Next →</a
        >
        <span
          th:unless="${hasMoreResults}"
          style="
            padding: 0.5rem 1rem;
            color: var(--text-disabled);
            cursor: not-allowed;
          "
          >Next →</span
        >
      </div>

      <style>
        .pagination-number:hover,
        .pagination-nav:hover {
          background: rgba(var(--accent-rgb), 0.1);
        }

        .pagination-number:active,
        .pagination-nav:active {
          transform: scale(0.95);
        }
      </style>

      <script th:inline="javascript">
        /*<![CDATA[*/
        const searchQuery = /*[[${query}]]*/ "";
        const searchResults = /*[[${results}]]*/ [];

        function requestAIAnalysis() {
          const button = document.getElementById("ai-analysis-btn");
          const container = document.getElementById("ai-analysis-container");
          const loadingPill = document.getElementById("ai-loading-pill");
          const resultPill = document.getElementById("ai-result-pill");

          // Fade out button
          button.style.opacity = "0";
          button.style.transform = "scale(0.9)";

          setTimeout(() => {
            button.style.display = "none";

            // Show container and loading pill with animation
            container.style.display = "block";
            container.style.opacity = "0";
            container.style.transform = "translateY(-10px)";
            loadingPill.style.display = "block";
            resultPill.style.display = "none";

            // Trigger animation
            requestAnimationFrame(() => {
              container.style.transition =
                "opacity 0.5s ease, transform 0.5s ease";
              container.style.opacity = "1";
              container.style.transform = "translateY(0)";
            });

            // Check if there are results
            if (!searchResults || searchResults.length === 0) {
              // No results - show message after brief loading
              setTimeout(() => {
                loadingPill.style.opacity = "0";
                loadingPill.style.transform = "scale(0.95)";

                setTimeout(() => {
                  loadingPill.style.display = "none";
                  const contentDiv = document.getElementById(
                    "ai-analysis-content"
                  );
                  contentDiv.textContent = "";
                  resultPill.style.display = "block";
                  resultPill.style.opacity = "0";
                  resultPill.style.transform = "translateY(-10px)";

                  requestAnimationFrame(() => {
                    resultPill.style.transition =
                      "opacity 0.6s ease, transform 0.6s ease";
                    resultPill.style.opacity = "1";
                    resultPill.style.transform = "translateY(0)";
                  });

                  setTimeout(() => {
                    contentDiv.style.color = "var(--error)";
                    typeWriter(
                      "Not enough search results to generate an AI overview. Please try a different search query.",
                      contentDiv,
                      5,
                      false
                    );
                  }, 400);
                }, 400);
              }, 800);
              return;
            }

            // Prepare results data
            const resultsData = searchResults.map((r) => ({
              url: r.url,
              title: r.title,
              snippet: r.snippet,
            }));

            // Make async request
            fetch("/api/ai-analysis", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                query: searchQuery,
                results: resultsData,
              }),
            })
              .then((response) => response.json())
              .then((data) => {
                // Fade out loading pill
                loadingPill.style.opacity = "0";
                loadingPill.style.transform = "scale(0.95)";

                setTimeout(() => {
                  loadingPill.style.display = "none";

                  // Prepare result pill
                  const contentDiv = document.getElementById(
                    "ai-analysis-content"
                  );
                  contentDiv.textContent = ""; // Clear content
                  resultPill.style.display = "block";
                  resultPill.style.opacity = "0";
                  resultPill.style.transform = "translateY(-10px)";

                  // Trigger fade in animation
                  requestAnimationFrame(() => {
                    resultPill.style.transition =
                      "opacity 0.6s ease, transform 0.6s ease";
                    resultPill.style.opacity = "1";
                    resultPill.style.transform = "translateY(0)";
                  });

                  // Start typewriter effect after pill is visible
                  setTimeout(() => {
                    // Check if response contains error or analysis
                    const message =
                      data.error ||
                      data.analysis ||
                      "Unable to generate AI analysis.";
                    // Set color based on whether it's an error or successful analysis
                    if (data.error) {
                      contentDiv.style.color = "var(--error)";
                    } else {
                      contentDiv.style.color = "var(--text-primary)";
                    }
                    typeWriter(message, contentDiv, 5, !data.error); // 5ms per character for speed
                  }, 400);
                }, 400);
              })
              .catch((error) => {
                loadingPill.style.opacity = "0";

                setTimeout(() => {
                  loadingPill.style.display = "none";
                  const contentDiv = document.getElementById(
                    "ai-analysis-content"
                  );
                  contentDiv.textContent = "Erro ao gerar análise: " + error;
                  contentDiv.style.color = "var(--error)";
                  resultPill.style.display = "block";
                  resultPill.style.opacity = "0";

                  requestAnimationFrame(() => {
                    resultPill.style.transition = "opacity 0.5s ease";
                    resultPill.style.opacity = "1";
                  });
                }, 400);
              });
          }, 300);
        }

        // Typewriter effect with glowing cursor
        function typeWriter(text, element, speed, checkWordCount = false) {
          let index = 0;
          element.classList.add("typing");
          element.setAttribute("data-full-text", text);

          // Check word count immediately and show button if needed
          if (checkWordCount) {
            const wordCount = text.trim().split(/\s+/).length;
            if (wordCount > 100) {
              const showMoreBtn = document.getElementById("ai-show-more-btn");
              if (showMoreBtn) {
                // Collapse content immediately
                element.classList.add("ai-content-collapsed");
                showMoreBtn.style.display = "block";
              }
            }
          }

          function type() {
            if (index < text.length) {
              const char = text.charAt(index);

              // Create span for each character with glow animation
              const span = document.createElement("span");
              span.textContent = char;
              span.className = "glow-char";
              element.appendChild(span);

              index++;

              // Add pause after paragraph breaks
              if (char === "\n" && text.charAt(index) === "\n") {
                setTimeout(type, 200); // 200ms pause between paragraphs
              } else {
                setTimeout(type, speed);
              }
            } else {
              element.classList.remove("typing");
            }
          }

          type();
        }

        function toggleAIContent() {
          const contentDiv = document.getElementById("ai-analysis-content");
          const btn = document.getElementById("ai-show-more-btn");

          if (contentDiv.classList.contains("ai-content-collapsed")) {
            contentDiv.classList.remove("ai-content-collapsed");
            btn.textContent = "Show Less";
          } else {
            contentDiv.classList.add("ai-content-collapsed");
            btn.textContent = "Show More";
            // Scroll to top of AI pill
            document
              .getElementById("ai-result-pill")
              .scrollIntoView({ behavior: "smooth", block: "nearest" });
          }
        }

        // Page search bar toggle functionality
        const pageForm = document.getElementById("page-search-form");
        const pageQueryInput = document.getElementById("page-query-input");
        const pageModeRadios = document.querySelectorAll(
          'input[name="page-mode"]'
        );
        const pageReturnQuery = document.getElementById("page-return-query");

        if (pageForm && pageQueryInput && pageModeRadios.length > 0) {
          pageModeRadios.forEach((radio) => {
            radio.addEventListener("change", function () {
              switch (this.value) {
                case "search":
                  pageForm.action = "/search";
                  pageForm.method = "get";
                  pageQueryInput.name = "q";
                  pageQueryInput.placeholder = "Search...";
                  if (pageReturnQuery) pageReturnQuery.disabled = true;
                  break;
                case "index":
                  pageForm.action = "/index";
                  pageForm.method = "post";
                  pageQueryInput.name = "url";
                  pageQueryInput.placeholder = "https://site.com/to/index";
                  if (pageReturnQuery) pageReturnQuery.disabled = false;
                  break;
                case "hackernews":
                  pageForm.action = "/index-hackernews";
                  pageForm.method = "post";
                  pageQueryInput.name = "query";
                  pageQueryInput.placeholder =
                    "Index HN stories with given terms...";
                  if (pageReturnQuery) pageReturnQuery.disabled = true;
                  break;
              }
            });
          });

          // Initially disable returnQuery if in search mode
          if (pageReturnQuery) {
            pageReturnQuery.disabled = true;
          }
        }

        // Async spell check - only on first page
        const currentPage = /*[[${page}]]*/ 0;
        if (currentPage === 0 && searchQuery) {
          checkSpelling(searchQuery);
        }

        function checkSpelling(query) {
          // Call the spell check API asynchronously
          fetch(`/api/spell-check?q=${encodeURIComponent(query)}`)
            .then((response) => response.json())
            .then((data) => {
              if (data.hasSuggestion && data.suggestion) {
                // Show the suggestion
                const container = document.getElementById(
                  "spell-suggestion-container"
                );
                const link = document.getElementById("spell-suggestion-link");

                link.textContent = data.suggestion;
                link.href = `/search?q=${encodeURIComponent(data.suggestion)}`;

                container.style.display = "block";

                console.log(
                  "[SpellCheck] Suggestion displayed:",
                  data.suggestion
                );
              }
            })
            .catch((error) => {
              console.error("[SpellCheck] Error:", error);
              // Fail silently - spell check is non-critical
            });
        }
        /*]]>*/
      </script>
    </main>
  </body>
</html>
