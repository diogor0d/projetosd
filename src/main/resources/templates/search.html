<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}"
>
  <head>
    <title th:text="${query} + ' - Googol Search'"></title>
  </head>
  <body>
    <main>
      <div class="search-options">
        <h2
          th:if="${hasResults}"
          style="font-weight: 400; color: var(--text-secondary)"
        >
          Results for
          <strong style="color: var(--accent)" th:text="${query}"></strong>
        </h2>

        <div class="action-buttons">
          <form th:action="@{/search}" method="get" style="display: inline">
            <input type="hidden" name="q" th:value="${query}" />
            <input type="hidden" name="page" th:value="${page}" />
            <input type="hidden" name="aiAnalysis" value="true" />
            <button type="submit" class="btn-secondary">🤖 AI Analysis</button>
          </form>

          <button
            onclick="toggleElement('hn-index-form')"
            class="btn-secondary"
          >
            📰 Index HackerNews
          </button>
        </div>
      </div>

      <div id="hn-index-form" style="display: none" class="hn-index">
        <form
          th:action="@{/index-hackernews}"
          method="post"
          style="display: flex; gap: 1rem; align-items: center"
        >
          <input type="hidden" name="query" th:value="${query}" />
          <label>Fetch top stories:</label>
          <input
            type="number"
            name="maxUrls"
            value="10"
            min="1"
            max="50"
            style="width: 80px"
          />
          <button
            type="submit"
            class="btn-secondary"
            style="background: var(--bg-hover)"
          >
            Go
          </button>
        </form>
      </div>

      <div
        th:if="${aiAnalysis}"
        class="ai-analysis"
        style="border-left: 4px solid var(--accent)"
      >
        <h3 style="margin-bottom: 0.5rem">🤖 Contextual Analysis</h3>
        <div
          class="analysis-content"
          th:text="${aiAnalysis}"
          style="
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.9rem;
          "
        ></div>
      </div>

      <div th:if="${hasResults}" class="search-results">
        <div th:each="result : ${results}" class="result-item">
          <div class="result-title">
            <a th:href="${result.url}" target="_blank" th:text="${result.title}"
              >Title</a
            >
          </div>
          <div class="result-url" th:text="${result.url}">url</div>
          <div class="result-citation" th:text="${result.snippet}">
            Description
          </div>

          <div style="margin-top: 0.5rem">
            <a
              th:href="@{/links-to(url=${result.url})}"
              style="
                color: var(--text-secondary);
                font-size: 0.8rem;
                text-decoration: none;
              "
            >
              ↳ See incoming links
            </a>
          </div>
        </div>
      </div>

      <div
        th:if="${!(hasResults ?: false) && query != null}"
        class="card"
        style="text-align: center; margin-top: 2rem"
      >
        <h3>No results found</h3>
        <p style="color: var(--text-secondary)">
          Try different keywords or index a new URL.
        </p>
      </div>

      <div
        th:if="${hasResults}"
        class="pagination"
        style="
          display: flex;
          justify-content: center;
          gap: 1rem;
          margin-top: 3rem;
        "
      >
        <a
          th:if="${page > 1}"
          th:href="@{/search(q=${query}, page=${page - 1})}"
          class="btn-secondary"
          >← Previous</a
        >
        <span style="padding: 0.5rem"
          >Page <span th:text="${page}">1</span></span
        >
        <a
          th:href="@{/search(q=${query}, page=${page + 1})}"
          class="btn-secondary"
          >Next →</a
        >
      </div>
    </main>
  </body>
</html>
