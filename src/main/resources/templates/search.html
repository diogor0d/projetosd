<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}"
>
  <head>
    <title th:text="${query} + ' - Googol Search'"></title>
  </head>
  <body>
    <main>
      <div class="search-options">
        <h2
          th:if="${hasResults}"
          style="font-weight: 400; color: var(--text-secondary)"
        >
          Results for
          <strong style="color: var(--accent)" th:text="${query}"></strong>
        </h2>

        <div class="action-buttons">
          <button type="button" class="btn-secondary" id="ai-analysis-btn" onclick="requestAIAnalysis()">
            <span class="btn-icon">🤖</span>
            <span class="btn-text">AI Analysis</span>
          </button>
        </div>
      </div>

      <!-- AI Analysis Loading/Result Container -->
      <div id="ai-analysis-container" style="display: none;">
        <!-- Loading State -->
        <div id="ai-loading-pill" class="ai-loading-pill">
          <div class="ai-loading-content">
            <span class="ai-loading-icon">🤖</span>
            <span class="ai-loading-text">Generating AI analysis</span>
            <span class="ai-loading-dots">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </span>
          </div>
        </div>

        <!-- Result State -->
        <div id="ai-result-pill" class="ai-analysis-pill" style="display: none;">
          <div class="ai-pill-header">
            <span class="ai-icon">🤖</span>
            <span class="ai-title">AI Contextual Analysis</span>
          </div>
          <div class="ai-pill-content" id="ai-analysis-content"></div>
        </div>
      </div>

      <div th:if="${hasResults}" class="search-results">
        <div th:each="result : ${results}" class="result-item">
          <div class="result-title">
            <a th:href="${result.url}" target="_blank" th:text="${result.title}"
              >Title</a
            >
          </div>
          <div class="result-url" th:text="${result.url}">url</div>
          <div class="result-citation" th:text="${result.snippet}">
            Description
          </div>

          <div style="margin-top: 0.5rem">
            <a
              th:href="@{/links-to(url=${result.url})}"
              style="
                color: var(--text-secondary);
                font-size: 0.8rem;
                text-decoration: none;
              "
            >
              ↳ See incoming links
            </a>
          </div>
        </div>
      </div>

      <div
        th:if="${!(hasResults ?: false) && query != null}"
        class="card"
        style="text-align: center; margin-top: 2rem"
      >
        <h3>No results found</h3>
        <p style="color: var(--text-secondary)">
          Try different keywords or index a new URL.
        </p>
      </div>

      <div
        th:if="${hasResults}"
        class="pagination"
        style="
          display: flex;
          justify-content: center;
          gap: 1rem;
          margin-top: 3rem;
        "
      >
        <a
          th:if="${page > 1}"
          th:href="@{/search(q=${query}, page=${page - 1})}"
          class="btn-secondary"
          >← Previous</a
        >
        <span style="padding: 0.5rem"
          >Page <span th:text="${page}">1</span></span
        >
        <a
          th:href="@{/search(q=${query}, page=${page + 1})}"
          class="btn-secondary"
          >Next →</a
        >
      </div>

      <script th:inline="javascript">
        /*<![CDATA[*/
        const searchQuery = /*[[${query}]]*/ '';
        const searchResults = /*[[${results}]]*/ [];

        function requestAIAnalysis() {
          const button = document.getElementById('ai-analysis-btn');
          const container = document.getElementById('ai-analysis-container');
          const loadingPill = document.getElementById('ai-loading-pill');
          const resultPill = document.getElementById('ai-result-pill');

          // Fade out button
          button.style.opacity = '0';
          button.style.transform = 'scale(0.9)';
          
          setTimeout(() => {
            button.style.display = 'none';
            
            // Show container and loading pill with animation
            container.style.display = 'block';
            container.style.opacity = '0';
            container.style.transform = 'translateY(-10px)';
            loadingPill.style.display = 'block';
            resultPill.style.display = 'none';
            
            // Trigger animation
            requestAnimationFrame(() => {
              container.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
              container.style.opacity = '1';
              container.style.transform = 'translateY(0)';
            });
          }, 300);

          // Prepare results data
          const resultsData = searchResults.map(r => ({
            url: r.url,
            title: r.title,
            snippet: r.snippet
          }));

          // Make async request
          fetch('/api/ai-analysis', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              query: searchQuery,
              results: resultsData
            })
          })
          .then(response => response.json())
          .then(data => {
            // Fade out loading pill
            loadingPill.style.opacity = '0';
            loadingPill.style.transform = 'scale(0.95)';
            
            setTimeout(() => {
              loadingPill.style.display = 'none';
              
              // Prepare result pill
              const contentDiv = document.getElementById('ai-analysis-content');
              contentDiv.textContent = ''; // Clear content
              resultPill.style.display = 'block';
              resultPill.style.opacity = '0';
              resultPill.style.transform = 'translateY(-10px)';
              
              // Trigger fade in animation
              requestAnimationFrame(() => {
                resultPill.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
                resultPill.style.opacity = '1';
                resultPill.style.transform = 'translateY(0)';
              });
              
              // Start typewriter effect after pill is visible
              setTimeout(() => {
                typeWriter(data.analysis, contentDiv, 5); // 5ms per character for speed
              }, 400);
            }, 400);
          })
          .catch(error => {
            loadingPill.style.opacity = '0';
            
            setTimeout(() => {
              loadingPill.style.display = 'none';
              document.getElementById('ai-analysis-content').textContent = 'Erro ao gerar análise: ' + error;
              resultPill.style.display = 'block';
              resultPill.style.opacity = '0';
              
              requestAnimationFrame(() => {
                resultPill.style.transition = 'opacity 0.5s ease';
                resultPill.style.opacity = '1';
              });
            }, 400);
          });
        }

        // Typewriter effect with glowing cursor
        function typeWriter(text, element, speed) {
          let index = 0;
          element.classList.add('typing');
          
          function type() {
            if (index < text.length) {
              const char = text.charAt(index);
              
              // Create span for each character with glow animation
              const span = document.createElement('span');
              span.textContent = char;
              span.className = 'glow-char';
              element.appendChild(span);
              
              index++;
              
              // Add pause after paragraph breaks
              if (char === '\n' && text.charAt(index) === '\n') {
                setTimeout(type, 200); // 200ms pause between paragraphs
              } else {
                setTimeout(type, speed);
              }
            } else {
              element.classList.remove('typing');
            }
          }
          
          type();
        }
        /*]]>*/
      </script>
    </main>
  </body>
</html>
