<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:replace="${title}">Googol</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header th:unless="${activePage == 'home'}">
      <nav>
        <a th:href="@{/}" class="logo">Googol</a>
        <div class="header-right">
          <a th:href="@{/stats}" class="stats-bar-link">
            <div class="stats-bar">
              <div class="stats-bar-content">
                <div class="stats-bar-item" title="Indexed Pages">
                  <span class="stats-bar-label">📄</span>
                  <span class="stats-bar-value" id="global-total-pages">-</span>
                </div>
                <div class="stats-bar-item" title="Queue Size">
                  <span class="stats-bar-label">⏳</span>
                  <span class="stats-bar-value" id="global-queue-size">-</span>
                </div>
                <div class="stats-bar-item" title="Active Barrels">
                  <span class="stats-bar-label">🗄️</span>
                  <span class="stats-bar-value" id="global-barrel-count"
                    >-</span
                  >
                </div>
                <div class="stats-bar-item">
                  <span id="global-live-indicator" class="live-dot"></span>
                </div>
              </div>
              <div class="stats-bar-expanded">
                <span class="stats-bar-action">Show Statistics</span>
              </div>
            </div>
          </a>
        </div>
      </nav>
    </header>

    <!-- Stats bar for home page only - centered at top -->
    <div th:if="${activePage == 'home'}" class="home-stats-bar">
      <a th:href="@{/stats}" class="stats-bar-link">
        <div class="stats-bar">
          <div class="stats-bar-content">
            <div class="stats-bar-item" title="Indexed Pages">
              <span class="stats-bar-label">📄</span>
              <span class="stats-bar-value" id="global-total-pages">-</span>
            </div>
            <div class="stats-bar-item" title="Queue Size">
              <span class="stats-bar-label">⏳</span>
              <span class="stats-bar-value" id="global-queue-size">-</span>
            </div>
            <div class="stats-bar-item" title="Active Barrels">
              <span class="stats-bar-label">🗄️</span>
              <span class="stats-bar-value" id="global-barrel-count">-</span>
            </div>
            <div class="stats-bar-item">
              <span id="global-live-indicator" class="live-dot"></span>
            </div>
          </div>
          <div class="stats-bar-expanded">
            <span class="stats-bar-action">Show Statistics</span>
          </div>
        </div>
      </a>
    </div>

    <main th:replace="${content}">
      <!-- Content will be inserted here -->
    </main>

    <footer>
      <p>&copy; 2025 Googol &middot; Projeto SD &middot; LEI</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script th:src="@{/js/global-stats.js}"></script>
  </body>
</html>
