<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Googol - Motor de Pesquisa</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <div class="container">
      <!-- cabeçalho com navegação -->
      <header>
        <nav>
          <a th:href="@{/}" class="logo">Googol</a>
          <div class="header-right">
            <!-- barra de estatísticas ao vivo -->
            <div class="stats-bar">
              <div class="stats-bar-item">
                <span class="stats-bar-label">📄</span>
                <span class="stats-bar-value" id="global-total-pages">-</span>
              </div>
              <div class="stats-bar-item">
                <span class="stats-bar-label">📊</span>
                <span class="stats-bar-value" id="global-queue-size">-</span>
              </div>
              <div class="stats-bar-item">
                <span class="stats-bar-label">🗄️</span>
                <span class="stats-bar-value" id="global-barrel-count">-</span>
              </div>
              <div class="stats-bar-indicator">
                <span id="global-live-indicator" class="live-dot"></span>
              </div>
            </div>
            <div class="nav-links">
              <a th:href="@{/}">Início</a>
              <a th:href="@{/stats}">Painel Sistema</a>
            </div>
          </div>
        </nav>
      </header>

      <main class="home-main">
        <!-- logo principal -->
        <div class="home-logo">
          <h1>Googol</h1>
          <p class="tagline">motor de pesquisa distribuído</p>
        </div>

        <!-- formulário de pesquisa -->
        <div class="search-box">
          <form id="search-form" th:action="@{/search}" method="get">
            <div class="search-input-wrapper">
              <input
                type="text"
                id="query-input"
                name="q"
                placeholder="Pesquisar..."
                required
                autofocus
              />
              <button type="submit" id="submit-btn" class="search-icon-btn">
                🔍
              </button>
            </div>
            <div class="search-mode-switch">
              <span class="switch-label">Pesquisar</span>
              <label class="switch">
                <input type="checkbox" id="index-mode" />
                <span class="slider"></span>
              </label>
              <span class="switch-label">Indexar URL</span>
            </div>
          </form>
        </div>

        <!-- mensagens de feedback -->
        <div
          th:if="${success}"
          class="alert alert-success"
          th:text="${success}"
        ></div>
        <div
          th:if="${error}"
          class="alert alert-error"
          th:text="${error}"
        ></div>
      </main>

      <footer>
        <p>&copy; 2025 Googol - Projeto SD</p>
      </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script th:src="@{/js/global-stats.js}"></script>
    <script>
      // Toggle between search and index mode
      const form = document.getElementById("search-form");
      const queryInput = document.getElementById("query-input");
      const indexModeCheckbox = document.getElementById("index-mode");

      indexModeCheckbox.addEventListener("change", function () {
        if (this.checked) {
          // Index mode
          form.action = "/index";
          form.method = "post";
          queryInput.name = "url";
          queryInput.placeholder = "https://example.com";
        } else {
          // Search mode
          form.action = "/search";
          form.method = "get";
          queryInput.name = "q";
          queryInput.placeholder = "Pesquisar...";
        }
      });
    </script>
  </body>
</html>
