<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}"
>
  <head>
    <title>Googol - Distributed Search</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/googol_favicon.svg}" />
  </head>
  <body>
    <main class="container home-main">
      <div class="home-logo">
        <img
          th:src="@{/googol_logo.svg}"
          alt="Googol"
          style="
            width: min(500px, 90vw);
            height: auto;
            display: block;
            margin: 0 auto;
          "
        />
        <p class="tagline">distributed crawling & indexing</p>
      </div>

      <div class="search-box">
        <form id="search-form" th:action="@{/search}" method="get">
          <div class="search-input-wrapper">
            <input
              type="text"
              id="query-input"
              name="q"
              placeholder="Search the web..."
              required
              autofocus
              autocomplete="off"
            />
            <button type="submit" id="submit-btn" class="search-icon-btn">
              ➝
            </button>
          </div>

          <div
            class="search-mode-switch"
            style="margin-top: 1rem; align-items: center"
          >
            <label class="mode-option">
              <input type="radio" name="mode" value="search" checked />
              <span class="mode-label">Search</span>
            </label>
            <label class="mode-option">
              <input type="radio" name="mode" value="index" />
              <span class="mode-label">Index URL</span>
            </label>
            <label class="mode-option">
              <input type="radio" name="mode" value="hackernews" />
              <span class="mode-label">Index HN</span>
            </label>
          </div>
        </form>
      </div>

      <div
        th:if="${success}"
        class="alert alert-success"
        style="color: var(--success); margin-top: 1rem"
      >
        <span th:text="${success}"></span>
      </div>
      <div
        th:if="${error}"
        class="alert alert-error"
        style="color: var(--error); margin-top: 1rem"
      >
        <span th:text="${error}"></span>
      </div>

      <script>
        // Inline script specific to Home
        const form = document.getElementById("search-form");
        const queryInput = document.getElementById("query-input");
        const modeRadios = document.querySelectorAll('input[name="mode"]');
        const submitBtn = document.getElementById("submit-btn");

        modeRadios.forEach((radio) => {
          radio.addEventListener("change", function () {
            switch (this.value) {
              case "search":
                form.action = "/search";
                form.method = "get";
                queryInput.name = "q";
                queryInput.placeholder = "Search the web...";
                submitBtn.innerHTML = "➝";
                break;
              case "index":
                form.action = "/index";
                form.method = "post";
                queryInput.name = "url";
                queryInput.placeholder = "https://site.com/to/index";
                submitBtn.innerHTML = "+";
                break;
              case "hackernews":
                form.action = "/search";
                form.method = "get";
                queryInput.name = "q";
                queryInput.placeholder = "Index HN stories with given terms...";
                submitBtn.innerHTML = "📰";
                break;
            }
          });
        });

        // Handle form submission for HackerNews mode
        form.addEventListener("submit", function (e) {
          const selectedMode = document.querySelector(
            'input[name="mode"]:checked'
          ).value;
          if (selectedMode === "hackernews") {
            e.preventDefault();
            const query = queryInput.value.trim();
            if (query) {
              // Change form to POST and submit to /index-hackernews
              form.action = "/index-hackernews";
              form.method = "post";
              queryInput.name = "query";
              form.submit();
            }
          }
        });
      </script>
    </main>
  </body>
</html>
