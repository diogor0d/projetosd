<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}"
>
  <head>
    <title>Googol - Dark Search</title>
  </head>
  <body>
    <main class="container home-main">
      <div class="home-logo">
        <h1>Googol</h1>
        <p class="tagline">distributed crawling & indexing</p>
      </div>

      <div class="search-box">
        <form id="search-form" th:action="@{/search}" method="get">
          <div class="search-input-wrapper">
            <input
              type="text"
              id="query-input"
              name="q"
              placeholder="Search the web..."
              required
              autofocus
              autocomplete="off"
            />
            <button type="submit" id="submit-btn" class="search-icon-btn">
              ➝
            </button>
          </div>

          <div
            class="search-mode-switch"
            style="
              margin-top: 1.5rem;
              display: flex;
              justify-content: center;
              align-items: center;
            "
          >
            <span class="switch-label active" id="search-label">Search</span>
            <label class="switch">
              <input type="checkbox" id="index-mode" />
              <span class="slider"></span>
            </label>
            <span class="switch-label" id="index-label">Index URL</span>
          </div>
        </form>

        <!-- HackerNews Indexing - Dynamic Island Style -->
        <div class="hn-island-container">
          <div class="hn-island">
            <div class="hn-island-compact">
              <span class="hn-icon">📰</span>
              <span class="hn-text">Index HackerNews</span>
            </div>
            <div class="hn-island-expanded">
              <form
                th:action="@{/index-hackernews}"
                method="post"
                class="hn-island-form"
              >
                <div class="hn-island-input-group">
                  <label for="hn-max-urls">Top stories:</label>
                  <input
                    type="number"
                    id="hn-max-urls"
                    name="maxUrls"
                    value="10"
                    min="1"
                    max="50"
                    class="hn-island-input"
                  />
                </div>
                <button type="submit" class="hn-island-btn">Index</button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <div
        th:if="${success}"
        class="alert alert-success"
        style="color: var(--success); margin-top: 1rem"
      >
        <span th:text="${success}"></span>
      </div>
      <div
        th:if="${error}"
        class="alert alert-error"
        style="color: var(--error); margin-top: 1rem"
      >
        <span th:text="${error}"></span>
      </div>

      <script>
        // Inline script specific to Home
        const form = document.getElementById("search-form");
        const queryInput = document.getElementById("query-input");
        const indexModeCheckbox = document.getElementById("index-mode");
        const searchLabel = document.getElementById("search-label");
        const indexLabel = document.getElementById("index-label");

        indexModeCheckbox.addEventListener("change", function () {
          if (this.checked) {
            form.action = "/index";
            form.method = "post";
            queryInput.name = "url";
            queryInput.placeholder = "https://site.com/to/index";
            document.getElementById("submit-btn").innerHTML = "+";
            // Toggle active class
            if (searchLabel) searchLabel.classList.remove('active');
            if (indexLabel) indexLabel.classList.add('active');
          } else {
            form.action = "/search";
            form.method = "get";
            queryInput.name = "q";
            queryInput.placeholder = "Search the web...";
            document.getElementById("submit-btn").innerHTML = "➝";
            // Toggle active class
            if (searchLabel) searchLabel.classList.add('active');
            if (indexLabel) indexLabel.classList.remove('active');
          }
        });
      </script>
    </main>
  </body>
</html>
