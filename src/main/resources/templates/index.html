<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}"
>
  <head>
    <title>Googol - Dark Search</title>
  </head>
  <body>
    <main class="container home-main">
      <div class="home-logo">
        <h1>Googol</h1>
        <p class="tagline">distributed crawling & indexing</p>
      </div>

      <div class="search-box">
        <form id="search-form" th:action="@{/search}" method="get">
          <div class="search-input-wrapper">
            <input
              type="text"
              id="query-input"
              name="q"
              placeholder="Search the web..."
              required
              autofocus
              autocomplete="off"
            />
            <button type="submit" id="submit-btn" class="search-icon-btn">
              ➝
            </button>
          </div>

          <div
            class="search-mode-switch"
            style="
              margin-top: 1.5rem;
              display: flex;
              justify-content: center;
              align-items: center;
            "
          >
            <span class="switch-label">Search</span>
            <label class="switch">
              <input type="checkbox" id="index-mode" />
              <span class="slider"></span>
            </label>
            <span class="switch-label">Index URL</span>
          </div>
        </form>
      </div>

      <div
        th:if="${success}"
        class="alert alert-success"
        style="color: var(--success); margin-top: 1rem"
      >
        <span th:text="${success}"></span>
      </div>
      <div
        th:if="${error}"
        class="alert alert-error"
        style="color: var(--error); margin-top: 1rem"
      >
        <span th:text="${error}"></span>
      </div>

      <script>
        // Inline script specific to Home
        const form = document.getElementById("search-form");
        const queryInput = document.getElementById("query-input");
        const indexModeCheckbox = document.getElementById("index-mode");

        indexModeCheckbox.addEventListener("change", function () {
          if (this.checked) {
            form.action = "/index";
            form.method = "post";
            queryInput.name = "url";
            queryInput.placeholder = "https://site.com/to/index";
            document.getElementById("submit-btn").innerHTML = "+";
          } else {
            form.action = "/search";
            form.method = "get";
            queryInput.name = "q";
            queryInput.placeholder = "Search the web...";
            document.getElementById("submit-btn").innerHTML = "➝";
          }
        });
      </script>
    </main>
  </body>
</html>
