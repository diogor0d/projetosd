<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}"
>
  <head>
    <title>System Status | Googol</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/googol_favicon.svg}" />
  </head>
  <body>
    <main>
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 2rem;
        "
      >
        <h1 style="margin: 0">System Statistics</h1>
        <div style="display: flex; align-items: center; gap: 0.5rem">
          <span id="live-indicator" class="live-dot"></span>
          <span style="font-size: 0.9rem; color: var(--text-secondary)"
            >Live</span
          >
        </div>
      </div>

      <div th:if="${stats}" id="stats-container">
        <section style="margin-bottom: 2rem">
          <div class="stats-grid">
            <div class="stat-card">
              <span
                class="stat-value"
                id="total-pages"
                th:text="${stats.totalIndexedPages}"
                >0</span
              >
              <span class="stat-label">Indexed Pages</span>
            </div>
            <div class="stat-card">
              <span
                class="stat-value"
                id="queue-size"
                th:text="${stats.urlQueueSize}"
                >0</span
              >
              <span class="stat-label">Queue Size</span>
            </div>
            <div class="stat-card">
              <span
                class="stat-value"
                id="barrel-count"
                th:text="${#lists.size(stats.barrelStats)}"
                >0</span
              >
              <span class="stat-label">Active Barrels</span>
            </div>
          </div>
        </section>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem">
          <section>
            <h2
              style="
                border-bottom: 1px solid var(--border);
                padding-bottom: 0.5rem;
                margin-bottom: 1rem;
              "
            >
              Storage Barrels
            </h2>
            <div id="barrel-stats">
              <div th:each="barrel : ${stats.barrelStats}" class="barrel-card">
                <h3 th:text="${barrel.barrelId}" style="color: var(--accent)">
                  ID
                </h3>
                <div
                  style="
                    display: flex;
                    justify-content: space-between;
                    margin-top: 0.5rem;
                    font-size: 0.9rem;
                  "
                >
                  <span
                    >Pages: <strong th:text="${barrel.indexSize}"></strong
                  ></span>
                  <span
                    >Avg Latency:
                    <strong
                      th:text="${#numbers.formatDecimal(barrel.avgResponseTime / 100, 1, 1)} + ' ds'"
                    ></strong
                  ></span>
                </div>
              </div>
            </div>
          </section>

          <section>
            <h2
              style="
                border-bottom: 1px solid var(--border);
                padding-bottom: 0.5rem;
                margin-bottom: 1rem;
              "
            >
              Trending
            </h2>
            <div id="top-searches" class="card">
              <ol style="padding-left: 1.5rem; color: var(--text-secondary)">
                <li
                  th:each="search : ${stats.topSearches}"
                  th:text="${search}"
                  style="margin-bottom: 0.5rem; color: var(--text-primary)"
                ></li>
              </ol>
            </div>
          </section>
        </div>

        <section th:if="${queueStatus}" style="margin-top: 2rem">
          <h3>Queue Dump</h3>
          <pre
            class="card"
            style="overflow-x: auto; font-size: 0.8rem; color: var(--success)"
            th:text="${queueStatus}"
          ></pre>
        </section>
      </div>
    </main>
  </body>
</html>
