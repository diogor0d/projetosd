# Configuração do Sistema Googol

# RMI Registry
rmi.host=localhost
rmi.port=1099

# Storage Barrels
barrel.count=2
barrel.data.path=./data/barrels/

# Downloaders
downloader.count=3
downloader.timeout=5000
downloader.max.depth=3
downloader.user.agent=Mozilla/5.0 (compatible; GoogolBot/1.0)
downloader.debug.mode=false
downloader.debug.delay.ms=1500

# Gateway
gateway.cache.enabled=true
gateway.cache.max.size=1000
gateway.load.balancing=round-robin

# URL Queue
queue.max.size=10000

# Search
search.results.per.page=10
search.min.word.length=3
