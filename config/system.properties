# ==============================================================================
# GOOGOL DISTRIBUTED SEARCH ENGINE - NETWORK CONFIGURATION
# ==============================================================================

# ------------------------------------------------------------------------------
# GATEWAY CONFIGURATION
# ------------------------------------------------------------------------------
# IMPORTANTE: Usar o endereço IP do host da Gateway (nao usar localhost!) quando a execução é distribuida entre maquinas

gateway.host=10.253.0.1
gateway.port=1099

# Gateway Cache & Performance Settings
gateway.search.cache.size=1000
gateway.recent.cache.size=10000
gateway.bloom.expected.urls=10000000
gateway.bloom.false.positive.rate=0.01
gateway.response.samples=20

# ------------------------------------------------------------------------------
# CLIENT CONFIGURATION
# ------------------------------------------------------------------------------
# Configurar a gateway a que o cliente se deve conectar

client.gateway.host=10.253.0.1
client.gateway.port=1099

# ------------------------------------------------------------------------------
# STORAGE BARRELS
# ------------------------------------------------------------------------------
barrel.use.saved.index=true
barrel.health.interval.ms=5000
barrel.shutdown.ms=500
barrel.save.timeout.ms=10000
barrel.sync.chunk.size=100

# ------------------------------------------------------------------------------
# DOWNLOADERS
# ------------------------------------------------------------------------------
downloader.timeout=5000
downloader.max.depth=3
downloader.worker.threads=5
downloader.debug.mode=false
downloader.debug.delay.ms=1500

