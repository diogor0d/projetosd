# configuração da aplicação Spring Boot Googol

# servidor web
server.port=8081
server.servlet.context-path=/
server.address=0.0.0.0

# HTTPS/SSL Configuration (Cloudflare Origin Certificate)
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=googol
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=googol
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3

# aplicação
spring.application.name=Googol Web

# thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# recursos estáticos
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# configuração RMI
googol.rmi.host=localhost
googol.rmi.port=1099
googol.rmi.name=Gateway

# OpenRouter.ai API (modelos LLM)
# modelos disponíveis em: https://openrouter.ai/models
# modelos grátis: meta-llama/llama-3.1-8b-instruct:free, google/gemini-flash-1.5
openrouter.model=meta-llama/llama-3.3-70b-instruct:free

# logging
logging.level.root=INFO
logging.level.frontend=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# websocket
spring.websocket.sockjs.enabled=true

# encoding
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# Cloudflare proxy configuration
server.forward-headers-strategy=NATIVE
server.tomcat.remoteip.remote-ip-header=CF-Connecting-IP
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.internal-proxies=.*

server.tomcat.redirect-context-root=true
server.tomcat.use-relative-redirects=true
